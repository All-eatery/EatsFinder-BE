name: CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev

permissions:
  pull-requests: read
  checks: write
  actions: write

jobs:
  PR_Merge_label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      build_nestjs: ${{ steps.PR-label-nestjs.outputs.result }}
      build_kotlin: ${{ steps.PR-label-kotlin.outputs.result }}
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: PR 라벨 네스트
        id: PR-label-nestjs
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            return labels.includes("nestjs");

      - name: PR 라벨 코틀린
        id: PR-label-kotlin
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            return labels.includes("kotlin");

  debug-check:
    needs: PR_Merge_label
    runs-on: ubuntu-latest
    steps:
      - name: 디버그용
        run: |
          echo "✅ build_nestjs: ${{ needs.PR_Merge_label.outputs.build_nestjs }}"
          echo "✅ build_kotlin: ${{ needs.PR_Merge_label.outputs.build_kotlin }}"

  nestjs-build:
    runs-on: ubuntu-latest
    needs: PR_Merge_label
    if: needs.PR_Merge_label.outputs.build_nestjs == 'true'
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@master

      - name: Docker Hub 로그인
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@master
        with:
          context: .
          file: ./Dockerfile.nestjs
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:nestjs
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nestjs-deploy:
    runs-on: ubuntu-latest
    needs: nestjs-build
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: .env 생성
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries | map(select(.key | startswith("ENV"))) | map("\(.key)=\(.value|tostring)") | .[]' > .env

      - name: .env 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: .env
          target: ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}
          overwrite: true

      - name: 서버 접속
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            cd ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}

            # Docker Hub 로그인
            echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

            # 이미지 풀링
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:nestjs

            NET_NAME="gotiger_default"
            NGINX="nginx"
            SVC="eatsfinder-nestjs"
            ACTIVE="${SVC}-active"

            # 현재 떠있는 쪽 기준 NEW/OLD 결정
            if docker ps --format '{{.Names}}' | grep -q "^${SVC}-blue$"; then
              NEW="${SVC}-green"; OLD="${SVC}-blue"
            else
              NEW="${SVC}-blue"; OLD="${SVC}-green"
            fi

            # 새 컨테이너 기동
            docker-compose up -d "$NEW"

            # nginx가 네트워크에 없으면 연결
            docker inspect -f '{{json .NetworkSettings.Networks}}' "$NGINX" | grep -q "\"$NET_NAME\"" || docker network connect "$NET_NAME" "$NGINX" || true

            # ---- 트래픽 전환: -active 별칭을 새 컨테이너로 이동 ----
            # 1) 이전 컨테이너에서 별칭 제거 효과: disconnect → 별칭 없이 다시 connect
            docker network disconnect "$NET_NAME" "$OLD" 2>/dev/null || true
            docker network connect    "$NET_NAME" "$OLD" 2>/dev/null || true

            # 2) 새 컨테이너에 별칭 부여(적용 확실히 하려고 disconnect 후 alias 붙여 재연결)
            docker network disconnect "$NET_NAME" "$NEW" 2>/dev/null || true
            docker network connect --alias "$ACTIVE" "$NET_NAME" "$NEW"

            # 3) nginx 런타임 DNS 캐시 갱신
            docker exec "$NGINX" nginx -s reload || true

            # 이전 버전 정리
            docker-compose stop "$OLD" || true
            docker-compose rm -f "$OLD" || true

  kotlin-build:
    runs-on: ubuntu-latest
    needs: PR_Merge_label
    if: needs.PR_Merge_label.outputs.build_kotlin == 'true'
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@master

      - name: Docker Hub 로그인
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@master
        with:
          context: .
          file: ./Dockerfile.kotlin
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:kotlin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kotlin-deploy:
    runs-on: ubuntu-latest
    needs: kotlin-build
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: .env 생성
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries | map(select(.key | startswith("ENV"))) | map("\(.key)=\(.value|tostring)") | .[]' > .env

      - name: .env 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: .env
          target: ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}
          overwrite: true

      - name: 서버 접속
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            cd ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}

            # Docker Hub 로그인
            echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

            # 이미지 풀링
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:kotlin

            NET_NAME="gotiger_default"
            NGINX="nginx"
            SVC="eatsfinder-kotlin"
            ACTIVE="${SVC}-active"

            # 현재 떠있는 쪽 기준 NEW/OLD 결정
            if docker ps --format '{{.Names}}' | grep -q "^${SVC}-blue$"; then
              NEW="${SVC}-green"; OLD="${SVC}-blue"
            else
              NEW="${SVC}-blue"; OLD="${SVC}-green"
            fi

            # 새 컨테이너 기동
            docker-compose up -d "$NEW"

            # nginx가 네트워크에 없으면 연결
            docker inspect -f '{{json .NetworkSettings.Networks}}' "$NGINX" | grep -q "\"$NET_NAME\"" || docker network connect "$NET_NAME" "$NGINX" || true

            # ---- 트래픽 전환: -active 별칭을 새 컨테이너로 이동 ----
            # 1) 이전 컨테이너에서 별칭 제거 효과: disconnect → 별칭 없이 다시 connect
            docker network disconnect "$NET_NAME" "$OLD" 2>/dev/null || true
            docker network connect    "$NET_NAME" "$OLD" 2>/dev/null || true

            # 2) 새 컨테이너에 별칭 부여(적용 확실히 하려고 disconnect 후 alias 붙여 재연결)
            docker network disconnect "$NET_NAME" "$NEW" 2>/dev/null || true
            docker network connect --alias "$ACTIVE" "$NET_NAME" "$NEW"

            # 3) nginx 런타임 DNS 캐시 갱신
            docker exec "$NGINX" nginx -s reload || true

            # 이전 버전 정리
            docker-compose stop "$OLD" || true
            docker-compose rm -f "$OLD" || true
