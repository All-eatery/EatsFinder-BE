name: CI/CD

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev

permissions:
  pull-requests: read
  checks: write
  actions: write

jobs:
  PR_Merge_label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      build_nestjs: ${{ steps.PR-label-nestjs.outputs.result }}
      build_kotlin: ${{ steps.PR-label-kotlin.outputs.result }}
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: PR 라벨 네스트
        id: PR-label-nestjs
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            return labels.includes("nestjs");

      - name: PR 라벨 코틀린
        id: PR-label-kotlin
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            return labels.includes("kotlin");

  debug-check:
    needs: PR_Merge_label
    runs-on: ubuntu-latest
    steps:
      - name: 디버그용
        run: |
          echo "✅ build_nestjs: ${{ needs.PR_Merge_label.outputs.build_nestjs }}"
          echo "✅ build_kotlin: ${{ needs.PR_Merge_label.outputs.build_kotlin }}"

  nestjs-build:
    runs-on: ubuntu-latest
    needs: PR_Merge_label
    if: needs.PR_Merge_label.outputs.build_nestjs == 'true'
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@master

      - name: Docker Hub 로그인
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@master
        with:
          context: .
          file: ./Dockerfile.nestjs
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:nestjs
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nestjs-deploy:
    runs-on: ubuntu-latest
    needs: nestjs-build
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: .env 생성
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries | map(select(.key | startswith("ENV"))) | map("\(.key)=\(.value|tostring)") | .[]' > .env

      - name: .env 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: .env
          target: ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}
          overwrite: true

      - name: 서버 접속
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            cd ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}

            # Docker Hub 로그인
            echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

            # 이미지 풀링
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:nestjs

            NET_NAME="gotiger_default"
            SVC="eatsfinder-nestjs"
            ACTIVE_ALIAS="${SVC}-active"
            NGINX_CONTAINER="nginx"

            # 현재 떠있는 쪽 판단
            if docker ps --format '{{.Names}}' | grep -q "^${SVC}-blue$"; then
              NEW="green"
              OLD="blue"
            else
              NEW="blue"
              OLD="green"
            fi

            docker-compose up -d "${SVC}-${NEW}"

            # 새 컨테이너에 active alias 부여 (기존 alias와 공존 가능)
            docker network connect --alias "${ACTIVE_ALIAS}" "${NET_NAME}" "${SVC}-${NEW}" 2>/dev/null || true

            # nginx DNS 캐시 즉시 갱신
            docker exec nginx nginx -s reload || true

            # 이전 컨테이너에서 active alias 제거: disconnect → 다시 connect(별칭 없이)
            docker network disconnect "${NET_NAME}" "${SVC}-${OLD}" 2>/dev/null || true
            docker network connect    "${NET_NAME}" "${SVC}-${OLD}" 2>/dev/null || true

            # 이전 컨테이너 정리
            docker compose stop "${SVC}-${OLD}"
            docker compose rm -f "${SVC}-${OLD}"

  kotlin-build:
    runs-on: ubuntu-latest
    needs: PR_Merge_label
    if: needs.PR_Merge_label.outputs.build_kotlin == 'true'
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@master

      - name: Docker Hub 로그인
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@master
        with:
          context: .
          file: ./Dockerfile.kotlin
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:kotlin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kotlin-deploy:
    runs-on: ubuntu-latest
    needs: kotlin-build
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@main

      - name: .env 생성
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries | map(select(.key | startswith("ENV"))) | map("\(.key)=\(.value|tostring)") | .[]' > .env

      - name: .env 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: .env
          target: ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}
          overwrite: true

      - name: 서버 접속
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.SERVER_PATH }}/site/${{ secrets.DOCKER_HUB_USERNAME }}

            # Docker Hub 로그인
            echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

            # 이미지 풀링
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_BE }}:kotlin

            # 새로운 이미지를 Green/Blue 중 하나로 태그
            if docker ps | grep eatsfinder-kotlin-blue; then
              NEW_DEPLOYMENT="green"
              OLD_DEPLOYMENT="blue"
            else
              NEW_DEPLOYMENT="blue"
              OLD_DEPLOYMENT="green"
            fi

            docker-compose up -d eatsfinder-kotlin-$NEW_DEPLOYMENT

            # 새 컨테이너가 시작될 시간을 기다림
            sleep 10

            # Nginx 설정 변경
            if [ "$NEW_DEPLOYMENT" == "green" ]; then
              sed -i "s/proxy_pass http:\/\/eatsfinder-kotlin-$OLD_DEPLOYMENT:8080;/proxy_pass http:\/\/eatsfinder-kotlin-$NEW_DEPLOYMENT:8080;/" ${{ secrets.SERVER_PATH }}/nginx/conf.d/eatsfinder.conf
            else
              sed -i "s/proxy_pass http:\/\/eatsfinder-kotlin-$OLD_DEPLOYMENT:8080;/proxy_pass http:\/\/eatsfinder-kotlin-$NEW_DEPLOYMENT:8080;/" ${{ secrets.SERVER_PATH }}/nginx/conf.d/eatsfinder.conf
            fi

            # Nginx 재시작
            docker-compose -f ${{ secrets.SERVER_PATH }}/docker-compose-multi.yml up -d --force-recreate --no-deps nginx

            # 이전 버전의 컨테이너 중지 및 제거
            docker-compose stop eatsfinder-kotlin-$OLD_DEPLOYMENT
            docker-compose rm -f eatsfinder-kotlin-$OLD_DEPLOYMENT
